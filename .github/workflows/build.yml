name: Build UnzipLite IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app/Contents/Developer
    
    - name: Build app
      run: |
        xcodebuild -project UnzipLite.xcodeproj \
          -scheme UnzipLite \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -derivedDataPath build \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          build
    
    - name: Package IPA
      run: |
        APP_PATH=$(find build/Build/Products -name "UnzipLite.app" -type d | head -1)
        echo "App found at: $APP_PATH"
        mkdir -p Payload
        cp -R "$APP_PATH" Payload/
        zip -r UnzipLite.ipa Payload
        ls -la UnzipLite.ipa
    
    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: UnzipLite.ipa
        path: UnzipLite.ipa
